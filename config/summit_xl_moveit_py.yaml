# MoveItPy configuration for Summit XL without namespaces
# All topics and frames are in the global namespace

planning_scene_monitor_options:
  name: "planning_scene_monitor"
  # Use standard parameter names - the MoveItConfigsBuilder loads these from files
  robot_description: "robot_description"
  robot_description_semantic: "robot_description_semantic"
  # All topics in global namespace
  joint_state_topic: "/joint_states"
  attached_collision_object_topic: "/moveit_cpp/planning_scene_monitor"
  publish_planning_scene_topic: "/moveit_cpp/publish_planning_scene"
  monitored_planning_scene_topic: "/moveit_cpp/monitored_planning_scene"
  wait_for_initial_state_timeout: 10.0

planning_pipelines:
  pipeline_names: ["ompl"]

plan_request_params:
  planning_attempts: 1
  planning_pipeline: ompl
  planner_id: "AnytimePathShortening"  # the arm's default_planner_config in ompl_planning.yaml
  planning_time: 5.0
  max_velocity_scaling_factor: 1.0
  max_acceleration_scaling_factor: 1.0

ompl_rrtc:
  plan_request_params:
    planning_attempts: 1
    planning_pipeline: ompl
    planner_id: "AnytimePathShortening"
    max_velocity_scaling_factor: 1.0
    max_acceleration_scaling_factor: 1.0
    planning_time: 1.0
